name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          tracked_generated="$({
            git ls-files |
              grep -P '(^artifacts/(?!\.gitkeep$)|^manifests/(?!\.gitkeep$)|(^|/)(node_modules|dist)/)' |
              grep -v -E '^manifests/(approved-sources|training-authorizations)\.jsonl$'
          } || true)"
          if [[ -n "$tracked_generated" ]]; then
            printf '%s\n' "$tracked_generated"
            echo "Generated artifacts must not be tracked"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/typescript/package-lock.json
      - name: Install locked Python dependencies
        run: uv sync --all-extras --locked
      - name: Install locked Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: tools/typescript
      - name: Lint and type-check Python
        run: make lint && uv run mypy
      - name: Build and type-check TypeScript helpers
        run: npm run build && npm run typecheck
        working-directory: tools/typescript
      - name: Test
        run: uv run pytest
      - name: Scan Python dependencies
        run: uv run pip-audit
      - name: Scan Python source
        run: uv run bandit -c pyproject.toml -r src
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
