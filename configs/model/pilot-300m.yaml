schema_version: 1
name: ts-coder-300m-pilot-planning
planning_only: true
minimum_parameters: 250000000
architecture:
  vocab_size: 32768
  context_length: 4096
  layers: 24
  hidden_size: 1024
  attention_heads: 16
  kv_heads: 4
  ffn_size: 2816
  normalization: rmsnorm
  position_encoding: rope
  activation: swiglu
  tied_embeddings: true
  parameter_count_estimate: 304137216
  hardware_contract: single-node-approved-gpu
  gradient_checkpointing: true
requires_recalculation:
  - compute_budget
  - corpus_size
  - token_budget
  - memory_budget
  - context_length
  - scaling_results
