schema_version: 1
run_name: streaming-check-resume2
model_config: configs/model/streaming-check.yaml
tokenizer_dir: artifacts/tokenizers/approved-32k
manifest: manifests/approved.jsonl
corpus_artifact: artifacts/corpus/approved/documents.jsonl
shard_manifest: artifacts/corpus/approved/shards-streaming-check.json
output_root: artifacts/runs
seed: 42
device: cpu
precision: fp32
sequence_length: 128
micro_batch_size: 1
gradient_accumulation_steps: 1
max_tokens: 1024
optimizer: {name: adamw, learning_rate: 0.0003, betas: [0.9, 0.95], weight_decay: 0.1}
scheduler: {name: cosine, warmup_tokens: 128, minimum_learning_rate_ratio: 0.1}
gradient_clip_norm: 1.0
objectives: {causal_fraction: 0.50, fim_fraction: 0.50, fim_min_span: 8, fim_max_span: 64}
validation_interval_tokens: 1024
checkpoint_interval_tokens: 1024
sample_interval_tokens: 1024
streaming: true
max_line_bytes: 16777216
resume_from: artifacts/runs/streaming-check/checkpoints/latest
