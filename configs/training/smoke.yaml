schema_version: 1
run_name: smoke-25m
model_config: configs/model/smoke-25m.yaml
tokenizer_dir: artifacts/tokenizers/production
manifest: manifests/approved-smoke.jsonl
output_root: artifacts/runs
seed: 42
device: cuda
precision: bf16
sequence_length: 2048
micro_batch_size: 1
gradient_accumulation_steps: 32
max_tokens: 250000000
optimizer: {name: adamw, learning_rate: 0.0006, betas: [0.9, 0.95], weight_decay: 0.1}
scheduler: {name: cosine, warmup_tokens: 5000000, minimum_learning_rate_ratio: 0.1}
gradient_clip_norm: 1.0
objectives: {causal_fraction: 0.50, fim_fraction: 0.50, fim_min_span: 8, fim_max_span: 512}
validation_interval_tokens: 1000000
checkpoint_interval_tokens: 5000000
sample_interval_tokens: 1000000
approval_required: true
